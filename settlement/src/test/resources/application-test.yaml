server:
  port: 0

spring:
  application:
    name: coupon-hub-settlement-test
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: false

framework:
  cache:
    redis:
      prefix: "coupon-hub-test:"

logging:
  level:
    root: WARN
    edu.seu.couponhub: INFO
