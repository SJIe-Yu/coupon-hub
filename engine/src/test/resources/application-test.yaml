server:
  port: 0

spring:
  application:
    name: coupon-hub-engine-test
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: coupon-hub-test

framework:
  cache:
    redis:
      prefix: "coupon-hub-test:"

logging:
  level:
    root: WARN
    edu.seu.couponhub: INFO
