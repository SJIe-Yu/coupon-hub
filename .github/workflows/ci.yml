name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      database: ${{ steps.filter.outputs.database }}
      merchant_admin: ${{ steps.filter.outputs.merchant_admin }}
      engine: ${{ steps.filter.outputs.engine }}
      settlement: ${{ steps.filter.outputs.settlement }}
      search: ${{ steps.filter.outputs.search }}
      gateway: ${{ steps.filter.outputs.gateway }}
      chart: ${{ steps.filter.outputs.chart }}
      base_changed: ${{ steps.scope.outputs.base_changed }}
      image_count: ${{ steps.scope.outputs.image_count }}
      image_matrix: ${{ steps.scope.outputs.image_matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'pom.xml'
              - 'framework/**'
              - 'api/**'
              - 'coverage-report/**'
              - 'Dockerfile.service'
              - '.docker/**'
            database:
              - 'database-migration/**'
              - 'resources/database/**'
            chart:
              - 'resources/helm-charts/coupon-hub-app/**'
            merchant_admin:
              - 'merchant-admin/**'
            engine:
              - 'engine/**'
            settlement:
              - 'settlement/**'
            search:
              - 'search/**'
            gateway:
              - 'gateway/**'
      - name: Determine image and deploy scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/deploy-plan

          services=(
            "merchant-admin:coupon-hub-merchant-admin"
            "engine:coupon-hub-engine"
            "settlement:coupon-hub-settlement"
            "search:coupon-hub-search"
            "gateway:coupon-hub-gateway"
          )

          selected=()
          if [[ "${{ steps.filter.outputs.common }}" == "true" || \
                "${{ steps.filter.outputs.chart }}" == "true" || \
                "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=("${services[@]}")
            echo "base_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_changed=false" >> "$GITHUB_OUTPUT"
            [[ "${{ steps.filter.outputs.merchant_admin }}" == "true" ]] && selected+=("merchant-admin:coupon-hub-merchant-admin")
            [[ "${{ steps.filter.outputs.engine }}" == "true" ]] && selected+=("engine:coupon-hub-engine")
            [[ "${{ steps.filter.outputs.settlement }}" == "true" ]] && selected+=("settlement:coupon-hub-settlement")
            [[ "${{ steps.filter.outputs.search }}" == "true" ]] && selected+=("search:coupon-hub-search")
            [[ "${{ steps.filter.outputs.gateway }}" == "true" ]] && selected+=("gateway:coupon-hub-gateway")
          fi

          : > .ci/deploy-plan/services.txt
          printf '[' > .ci/deploy-plan/image-matrix.json
          first=true
          for item in "${selected[@]}"; do
            module="${item%%:*}"
            artifact="${item##*:}"
            printf '%s\n' "${module}:${artifact}" >> .ci/deploy-plan/services.txt
            if [[ "$first" == "true" ]]; then
              first=false
            else
              printf ',' >> .ci/deploy-plan/image-matrix.json
            fi
            printf '{"module":"%s","artifact":"%s"}' "$module" "$artifact" >> .ci/deploy-plan/image-matrix.json
          done
          printf ']' >> .ci/deploy-plan/image-matrix.json

          echo "image_count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "image_matrix=$(jq -c '{include: .}' .ci/deploy-plan/image-matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Upload deploy plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-deploy-plan
          path: .ci/deploy-plan/
          if-no-files-found: error

  build-and-unit-test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile all modules
        run: ./mvnw -T 1C -DskipTests compile
      - name: Run unit tests
        run: ./mvnw -T 1C test
      - name: Upload JaCoCo unit test data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-ut-exec
          path: '**/target/jacoco.exec'
          if-no-files-found: ignore
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  integration-test:
    runs-on: ubuntu-latest
    needs: [changes, build-and-unit-test]
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.database == 'true' ||
      needs.changes.outputs.merchant_admin == 'true' ||
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.settlement == 'true' ||
      needs.changes.outputs.search == 'true' ||
      needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Determine integration test scope
        id: scope
        run: |
          if [[ "${{ needs.changes.outputs.common }}" == "true" || \
                "${{ needs.changes.outputs.database }}" == "true" ]]; then
            echo "mvn_args=-P it verify" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.changes.outputs.merchant_admin }}" == "true" ]]; then
            echo "mvn_args=-pl merchant-admin,database-migration -am -P it verify" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.changes.outputs.engine }}" == "true" ]]; then
            echo "mvn_args=-pl engine,database-migration -am -P it verify" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.changes.outputs.settlement }}" == "true" ]]; then
            echo "mvn_args=-pl settlement,database-migration -am -P it verify" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.changes.outputs.search }}" == "true" ]]; then
            echo "mvn_args=-pl search,database-migration -am -P it verify" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.changes.outputs.gateway }}" == "true" ]]; then
            echo "mvn_args=-pl gateway,database-migration -am -P it verify" >> $GITHUB_OUTPUT
          else
            echo "mvn_args=-P it verify" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./mvnw -T 1C ${{ steps.scope.outputs.mvn_args }}
      - name: Upload JaCoCo integration test data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-it-exec
          path: '**/target/jacoco-it.exec'
          if-no-files-found: ignore
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports/'
          if-no-files-found: ignore

  coverage-report:
    runs-on: ubuntu-latest
    needs: [build-and-unit-test, integration-test]
    if: always() && needs.build-and-unit-test.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download JaCoCo unit test data
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: jacoco-ut-exec
          path: .
      - name: Download JaCoCo integration test data
        if: needs.integration-test.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: jacoco-it-exec
          path: .
      - name: Compile for coverage report
        run: ./mvnw -T 1C -DskipTests compile
      - name: Generate aggregate coverage report
        run: ./mvnw -pl coverage-report -am -DskipTests verify
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: warn
      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: coverage-report/target/site/jacoco-aggregate/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 50
          title: '代码覆盖率报告'
          update-comment: true

  build-and-push-images:
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-unit-test.result == 'success' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') &&
      needs.changes.outputs.image_count != '0'
    runs-on: ubuntu-latest
    needs: [changes, build-and-unit-test, integration-test]
    strategy:
      matrix: ${{ fromJson(needs.changes.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image repository
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.artifact }}" >> "$GITHUB_OUTPUT"
      - name: Build and push service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/arm64
          push: true
          build-args: |
            SERVICE_MODULE=${{ matrix.module }}
            SERVICE_ARTIFACT=${{ matrix.artifact }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
