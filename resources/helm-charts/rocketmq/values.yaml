environment: dev

imagePullPolicy: IfNotPresent
nameOverride: ""
fullnameOverride: ""

nameserver:
  image: apache/rocketmq:5.3.1
  replicaCount: 1
  service:
    type: ClusterIP
    port: 9876
    nodePort: null
  resources: {}

broker:
  image: apache/rocketmq:5.3.1
  replicaCount: 1
  clusterName: DefaultCluster
  brokerName: broker-a
  brokerId: 0
  autoCreateTopicEnable: true
  service:
    type: ClusterIP
    remotingPort: 10911
    fastPort: 10909
    haPort: 10912
    nodePorts:
      remoting: null
      fast: null
      ha: null
  persistence:
    enabled: false
    size: 8Gi
    storageClass: ""
  resources: {}

dashboard:
  enabled: false
  image: apacherocketmq/rocketmq-dashboard:latest
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8082
    nodePort: null
  resources: {}
