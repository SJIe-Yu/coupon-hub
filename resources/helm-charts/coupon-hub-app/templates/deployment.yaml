apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coupon-hub-app.fullname" . }}
  labels:
    {{- include "coupon-hub-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coupon-hub-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "coupon-hub-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.skywalking.enabled }}
      initContainers:
        - name: skywalking-agent
          image: {{ .Values.skywalking.image | quote }}
          imagePullPolicy: {{ .Values.skywalking.pullPolicy }}
          command: ["/bin/sh"]
          args: ["-c", "cp -R /skywalking/agent /agent/"]
          volumeMounts:
            - name: {{ .Values.skywalking.volumeName }}
              mountPath: /agent
      {{- end }}
      containers:
        - name: {{ include "coupon-hub-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if and .Values.skywalking.enabled (not (hasKey .Values.env "JAVA_TOOL_OPTIONS")) }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:{{ .Values.skywalking.agentPath }}"
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.skywalking.enabled }}
          volumeMounts:
            - name: {{ .Values.skywalking.volumeName }}
              mountPath: /skywalking
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.skywalking.enabled }}
      volumes:
        - name: {{ .Values.skywalking.volumeName }}
          emptyDir: {}
      {{- end }}
