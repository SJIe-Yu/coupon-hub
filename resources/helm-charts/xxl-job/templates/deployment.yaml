apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xxl-job.fullname" . }}
  labels:
    {{- include "xxl-job.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "xxl-job.name" . }}
  template:
    metadata:
      labels:
        {{- include "xxl-job.labels" . | nindent 8 }}
    spec:
      containers:
        - name: xxl-job-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "xxl-job.fullname" . }}-config

