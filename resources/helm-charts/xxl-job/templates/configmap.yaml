apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xxl-job.fullname" . }}-config
  labels:
    {{- include "xxl-job.labels" . | nindent 4 }}
data:
  application.properties: |
    server.port=8080
    server.servlet.context-path={{ .Values.admin.contextPath }}
    spring.mvc.servlet.load-on-startup=0
    spring.resources.static-locations=classpath:/static/
    spring.datasource.url=jdbc:mysql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.database }}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    spring.datasource.username={{ .Values.database.username }}
    spring.datasource.password={{ .Values.database.password }}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.datasource.type=com.zaxxer.hikari.HikariDataSource
    spring.datasource.hikari.minimum-idle=10
    spring.datasource.hikari.maximum-pool-size=30
    spring.datasource.hikari.auto-commit=true
    spring.datasource.hikari.idle-timeout=30000
    spring.datasource.hikari.pool-name=HikariCP
    spring.datasource.hikari.max-lifetime=900000
    spring.datasource.hikari.connection-timeout=10000
    spring.datasource.hikari.connection-test-query=SELECT 1
    mybatis.mapper-locations=classpath:/mybatis-mapper/*Mapper.xml
    xxl.job.accessToken={{ .Values.admin.accessToken }}
    xxl.job.i18n=zh_CN
    xxl.job.triggerpool.fast.max=200
    xxl.job.triggerpool.slow.max=100
    xxl.job.logretentiondays={{ .Values.admin.logRetentionDays }}

