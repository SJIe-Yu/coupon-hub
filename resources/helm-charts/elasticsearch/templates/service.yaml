apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-es
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9200
      targetPort: 9200
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - port: 9300
      targetPort: 9300
      name: transport
  selector:
    app: {{ .Release.Name }}-es
