server:
  port: 10000

spring:
  application:
    name: coupon-hub-gateway
  config:
    import:
      - optional:nacos:coupon-hub-gateway-dev.yaml?group=COUPON_HUB_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.252.4:30848}
        namespace: ${NACOS_NAMESPACE:coupon-hub-dev}
        group: COUPON_HUB_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.252.4:30848}
        namespace: ${NACOS_NAMESPACE:coupon-hub-dev}
        group: COUPON_HUB_GROUP
        file-extension: yaml
      password: ${NACOS_PASSWORD:123456}
